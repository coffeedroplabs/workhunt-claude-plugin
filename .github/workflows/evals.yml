name: Evals

# Every run is real model usage billed to ANTHROPIC_API_KEY, so this runs on
# demand and from the release workflow, not on every push.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        default: "3"
  workflow_call:
    inputs:
      skip_without_key:
        description: Pass with a warning, instead of failing, when the API key secret is not set
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.322"
  EVAL_MODEL: ${{ vars.EVAL_MODEL || 'claude-sonnet-5-5' }}
  EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'claude-haiku-5-5' }}

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs || '3' }}
          SKIP_WITHOUT_KEY: ${{ inputs.skip_without_key || 'false' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            if [ "$SKIP_WITHOUT_KEY" = "true" ]; then
              echo "::warning::ANTHROPIC_API_KEY is not set, so the evals were skipped. Run them locally before releasing."
              exit 0
            fi
            echo "::error::The ANTHROPIC_API_KEY repository secret is not set."
            exit 1
          fi
          claude plugin eval plugins/workhunt \
            --trust-plugin --no-publish \
            --model "$EVAL_MODEL" --judge-model "$EVAL_JUDGE_MODEL" \
            --runs "$RUNS" --concurrency 4 --threshold 1.0 --max-cost-usd 20 \
            --output-dir eval-results --report eval-results/report.html
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: warn
